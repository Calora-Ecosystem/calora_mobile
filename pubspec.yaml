name: calora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  get_it: ^8.2.0
  injectable: ^2.5.1
  auto_route: ^10.1.2
  easy_localization_generator:
    git: https://github.com/imnadev/easy_localization_generator.git
  easy_localization_loader: ^2.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  alice: ^1.0.0
  logger: ^2.6.1
  rx_shared_preferences: ^4.0.0
  mask_text_input_formatter: ^2.9.0
  flutter_svg: ^2.2.0
  keyboard_dismisser: ^3.0.0
  flutter_custom_tabs: ^2.4.0
  async: ^2.13.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^7.1.1
  jwt_decoder: ^2.0.1
  management: ^0.0.2
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  alice_dio: ^1.0.7
  firebase_app_installations: ^0.4.0
  device_info_plus: ^11.5.0
  firebase_messaging: ^16.0.0
  flutter_widget_from_html: ^0.17.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.8.1
  auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.11.0
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/localization/
    - assets/icons/

flutter_gen:
  output: lib/common/gen
  integrations:
    flutter_svg: true
    lottie: true