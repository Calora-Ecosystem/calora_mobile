name: calora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  health: ^13.1.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.9
  cupertino_icons: ^1.0.8
  easy_localization: ^3.0.8
  pin_code_fields: ^8.0.1
  get_it: ^8.2.0
  injectable: ^2.5.1
  auto_route: ^10.1.2
  permission_handler: ^12.0.1
  easy_localization_generator:
    git: https://github.com/imnadev/easy_localization_generator.git
  easy_localization_loader: ^2.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  alice: ^1.0.0
  logger: ^2.6.1
  rx_shared_preferences: ^4.0.0
  mask_text_input_formatter: ^2.9.0
  percent_indicator: ^4.2.5
  flutter_svg: ^2.2.0
  keyboard_dismisser: ^3.0.0
  flutter_custom_tabs: ^2.4.0
  async: ^2.13.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  google_sign_in: ^7.1.1
  jwt_decoder: ^2.0.1
  management: ^0.0.2
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  alice_dio: ^1.0.7
  firebase_app_installations: ^0.4.0
  device_info_plus: ^11.5.0
  firebase_messaging: ^16.0.0
  flutter_widget_from_html: ^0.17.0
  fl_chart: ^1.1.0
  pedometer: ^4.1.1
  pedometer_2: ^5.0.4
  cm_pedometer: ^1.2.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  workmanager: ^0.9.0+3


dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.8.1
  auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.11.0
  build_runner: ^2.7.0
  freezed: ^3.2.0
  json_serializable: ^6.11.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/localization/
    - assets/icons/
    - assets/images/
    - flutter_native_splash.yaml
  fonts:
    - family: Inter
      fonts:
       - asset: assets/fonts/Inter-Medium.ttf
       - asset: assets/fonts/Inter-Regular.ttf
       - asset: assets/fonts/Inter-Light.ttf
       - asset: assets/fonts/Inter-Thin.ttf
       - asset: assets/fonts/Inter-Bold.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_logo.png"
  min_sdk_android: 21

flutter_gen:
  output: lib/common/gen
  integrations:
    flutter_svg: true
    lottie: true

flutter_native_splash:

      background_image: assets/icons/ic_splash_background.png

      image: assets/icons/ic_splash_calora.png
#

      android_12:

       image: assets/icons/ic_logo.png

