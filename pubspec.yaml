name: calora
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+56

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  health: ^13.1.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.9
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.3.1
  easy_localization: ^3.0.8
  pin_code_fields: ^8.0.1
  get_it: ^9.2.0
  injectable: ^2.5.1
  auto_route: ^10.2.3
  permission_handler: ^12.0.1
  easy_localization_generator:
    git: https://github.com/imnadev/easy_localization_generator.git
  easy_localization_loader: ^2.0.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  alice: ^1.0.0
  logger: ^2.6.1
  rx_shared_preferences: ^4.0.0
  rxdart: ^0.28.0
  mask_text_input_formatter: ^2.9.0
  percent_indicator: ^4.2.5
  flutter_svg: ^2.2.0
  keyboard_dismisser: ^3.0.0
  flutter_custom_tabs: ^2.4.0
  async: ^2.13.0
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  google_sign_in: ^7.2.0
  jwt_decoder: ^2.0.1
  management: ^0.0.2
  dio: ^5.9.0
  pretty_dio_logger: ^1.4.0
  alice_dio: ^1.0.7
  firebase_app_installations: ^0.4.0+5
  device_info_plus: ^12.3.0
  firebase_messaging: ^16.1.1
  flutter_widget_from_html: ^0.17.0
  fl_chart: ^1.1.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  url_launcher: ^6.3.2
  package_info_plus: ^8.3.1
  camera: ^0.11.3
  table_calendar: ^3.2.0
  auto_size_text: ^3.0.0
  carousel_slider: ^5.1.1
  record: ^6.1.2
  just_audio: ^0.10.5
  flutter_dotenv: ^6.0.0
  http_parser: ^4.1.2
  change_app_package_name: ^1.5.0
  custom_refresh_indicator: ^4.0.1
  image: ^4.7.2
  screenshot: ^3.0.0
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^4.1.0
  vector_graphics: any
  intl: any
  video_player: any
  collection: any
  connectivity_plus: ^6.1.5
  lottie: ^3.3.2
  youtube_player_iframe: ^5.2.2
  flutter_local_notifications: ^19.5.0
  flutter_foreground_task: ^9.2.0
  flutter_overlay_window: ^0.5.0
  confetti: ^0.8.0
  pedometer_2: ^5.0.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  workmanager: ^0.9.0+3
  android_intent_plus: ^6.0.0
  purchases_flutter: ^9.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  injectable_generator: ^2.8.1
  auto_route_generator: ^10.2.6
  flutter_gen_runner: 5.12.0
  flutter_gen_core: 5.12.0
  build_runner: ^2.7.1
  freezed: ^3.2.0
  json_serializable: ^6.11.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/localization/
    - assets/icons/
    - assets/images/
    - assets/lottie/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Light.ttf
        - asset: assets/fonts/Inter-Thin.ttf
        - asset: assets/fonts/Inter-Bold.ttf

flutter_gen:
  output: lib/common/gen
  integrations:
    flutter_svg: true
    lottie: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/ic_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F3F3F3"
  image: assets/icons/ic_native_splash_logo.png
  android: true
  ios: true
  fullscreen: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  android_12:
    color: "#F3F3F3"
    fullscreen: true
    image: assets/icons/ic_native_splash_logo.png

dependency_overrides:
  flutter_gen_runner: 5.12.0
  flutter_gen_core: 5.12.0